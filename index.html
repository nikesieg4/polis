<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POLIS | Strafregister</title>
<meta name="description" content="Strafregister der Polizei Berlin City Roleplay.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 38'%3E%3Cpath d='M17 1.5 31.5 7v11c0 9.2-6.1 15.8-14.5 18.5C8.6 33.8 2.5 27.2 2.5 18V7L17 1.5Z' fill='%230B1220' stroke='%234C8DFF' stroke-width='2.4'/%3E%3Cpath d='m17 10 2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.6-4.8 2.6.9-5.4-3.9-3.8 5.4-.8L17 10Z' fill='%234C8DFF'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=11">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg width="26" height="30" viewBox="0 0 34 38" fill="none" aria-hidden="true"><path d="M17 1.5 31.5 7v11c0 9.2-6.1 15.8-14.5 18.5C8.6 33.8 2.5 27.2 2.5 18V7L17 1.5Z" stroke="#4C8DFF" stroke-width="2.2"/><path d="m17 10 2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.6-4.8 2.6.9-5.4-3.9-3.8 5.4-.8L17 10Z" fill="#4C8DFF"/></svg>
    <span class="brand-name">POLIS</span>
    <span class="muted brand-sub">Polizei Berlin City RP</span>
    <span id="modeNote" class="mode-note" hidden></span>
  </div>
  <div class="officer">
    <label class="officer-field">
      <span class="sr">Dein Name</span>
      <input id="officerName" type="text" placeholder="Dein Name" autocomplete="off">
    </label>
    <label class="officer-field">
      <span class="sr">Dienstnummer</span>
      <input id="officerNr" type="text" placeholder="Dienstnr." autocomplete="off">
    </label>
    <button type="button" id="logoutBtn" class="btn-ghost" hidden>Abmelden</button>
  </div>
</header>

<div class="layout">
  <main class="col col-search">
    <section class="card">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tabPersonen" class="tab active" aria-selected="true">Personen</button>
        <button type="button" role="tab" id="tabHb" class="tab" aria-selected="false">Haftbefehle <span id="hbCount" class="tab-count"></span></button>
      </div>
      <label class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA6BF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="sr">Person suchen</span>
        <input id="q" type="search" placeholder="Name, @RobloxName oder Personen-ID" autocomplete="off" spellcheck="false">
      </label>
      <span id="count" class="muted small"></span>
      <div id="results" class="results"></div>
      <div id="create"></div>
      <div id="hbResults" class="results" hidden></div>
    </section>
  </main>

  <aside class="col col-record" aria-label="Strafregister">
    <div id="record"></div>
    <section id="hbBox" class="card" hidden>
      <div class="row-between">
        <h2>Haftbefehle</h2>
        <button type="button" id="hbNewBtn" class="btn-ghost">Haftbefehl ausstellen</button>
      </div>
      <form id="hbForm" class="hb-form" hidden>
        <div class="hb-grid">
          <label class="field">Kennzeichen<input id="hbKz" type="text" maxlength="20" placeholder="z. B. M OO 01" autocomplete="off"></label>
          <label class="field">Auto Modell<input id="hbModell" type="text" maxlength="60" placeholder="z. B. Schwarzer RS4" autocomplete="off"></label>
        </div>
        <label class="field">Grund<input id="hbGrund" type="text" maxlength="200" list="hbGruende" required autocomplete="off" placeholder="z. B. § 2 Mord"></label>
        <datalist id="hbGruende"></datalist>
        <label class="field">Beweise<input id="hbBeweise" type="text" maxlength="500" placeholder="z. B. Bodycam, Zeuge Miguel" autocomplete="off"></label>
        <div class="hb-form-actions">
          <button type="submit" class="btn btn-primary">Ausstellen</button>
          <button type="button" id="hbCancel" class="btn-ghost">Abbrechen</button>
        </div>
        <span id="hbFormError" class="error-msg" role="alert"></span>
      </form>
      <div id="hbList"></div>
    </section>
    <section id="strafeBox" class="card" hidden>
      <h2>Strafe vergeben</h2>
      <label class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA6BF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="sr">Strafe suchen</span>
        <input id="strafeQ" type="search" placeholder="Strafe suchen, z. B. Raub oder § 8" autocomplete="off" spellcheck="false">
      </label>
      <div id="strafeResults" class="strafen"></div>
      <span id="strafeMsg" class="saved" role="status"></span>
    </section>
    <div id="history"></div>
  </aside>
</div>

<footer class="footer">
  <button type="button" id="resetBtn" class="linkbtn" hidden>Testdaten zurücksetzen</button>
</footer>

<div id="gate" class="gate" hidden>
  <form id="gateForm" class="card gate-card">
    <h1>Anmelden</h1>
    <label class="field">Dienstschlüssel
      <input id="gateKey" type="password" autocomplete="current-password" required>
    </label>
    <span id="gateError" class="gate-error" role="alert"></span>
    <button type="submit" class="btn btn-primary full">Anmelden</button>
  </form>
</div>

<script src="app.js?v=11"></script>
</body>
</html>
